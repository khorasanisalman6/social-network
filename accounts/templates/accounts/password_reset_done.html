
{% extends 'base.html' %}

{% block title %}Check Your Email{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="col-md-6 mx-auto card shadow border-0">
        <div class="card-body text-center p-4">
            <h3 class="text-success">Check Your Email</h3>

            <p class="text-muted mt-3">
                If an account exists with that email,
                we have sent instructions to reset your password.
            </p>

            <a href="{% url 'account:login' %}" class="btn btn-primary">
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
