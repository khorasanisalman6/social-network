
{% extends 'base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="col-md-6 mx-auto card shadow border-0">
        <div class="card-body p-4">
            {% if validlink %}
                <h3 class="mb-3">Set New Password</h3>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success w-100">
                        Change Password
                    </button>
                </form>
            {% else %}
                <h3 class="text-danger">Invalid Link</h3>

                <p>
                    This password reset link is invalid or has expired.
                </p>

                <a href="{% url 'account:password_reset' %}"
                   class="btn btn-primary">
                    Request New Link
                </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
