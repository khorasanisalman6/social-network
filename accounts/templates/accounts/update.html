{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h1 class="mb-4">Update User</h1>

                <form action="" method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    	<div class="mb-3">
                            {{ field.label_tag }}
                            {{ field }}
                            {% for error in field.errors %}
                            	<div class="text-danger">{{ error }}</div>
                            {% endfor %}

                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary form-control mt-3">Edit</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
