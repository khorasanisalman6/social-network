{% extends 'base.html' %}

{% block title %}
	Login
{% endblock %}
{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <h1 class="mb-4">
                   Login User
                </h1>
                <form action="" method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    	<div class="mb4">
                            {{ field.label_tag }}
                            {{ field }}
                            {% for error in field.errors %}
                            	<div class="text-danger">{{ error }}</div>
                            {% endfor %}

                        </div>
                    {% endfor %}
                    <input type="submit" value="Login" class="btn btn-primary form-control mt-3">
                    <div class="mt-3">
                        <a href="{% url 'account:password_reset' %}">
                            Forgot your password?
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}
